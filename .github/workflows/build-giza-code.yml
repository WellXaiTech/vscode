name: Build GiZa Code

# Builds GiZa Code installers/archives for Windows, Linux and macOS and
# publishes them as a GitHub release, following the same gulp packaging
# tasks the upstream product pipelines use (core compile is folded into
# the one-shot `vscode-<platform>-<arch>-min` tasks).
#
# Trigger it manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=8192
  # Electron/ripgrep and other postinstall downloads hit the GitHub API;
  # an authenticated token avoids anonymous rate limits.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Locate Visual Studio
        shell: pwsh
        # build/npm/preinstall.ts only probes the default 2022/2019 install
        # paths, which newer runner images no longer use -- point its
        # vs2022_install override at whatever VS instance the runner has.
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { $vsPath = & $vswhere -latest -products * -property installationPath }
          if (-not $vsPath) { Write-Error "No Visual Studio installation found"; exit 1 }
          Write-Host "Using Visual Studio at: $vsPath"
          "vs2022_install=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build GiZa Code (win32-x64)
        run: npm run gulp vscode-win32-x64-min

      - name: Build user-setup installer
        run: |
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $setup = Get-ChildItem -Recurse .build\win32-x64 -Filter *.exe | Select-Object -First 1
          Copy-Item $setup.FullName artifacts\GiZaCode-Setup-win32-x64.exe
          Compress-Archive -Path ..\VSCode-win32-x64\* -DestinationPath artifacts\GiZaCode-win32-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: giza-code-windows
          path: artifacts/*

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbfile-dev \
            libsecret-1-dev libkrb5-dev fakeroot dpkg-dev

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            sleep 15
          done

      - name: Build GiZa Code (linux-x64)
        run: npm run gulp vscode-linux-x64-min

      - name: Build .deb package
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp .build/linux/deb/amd64/deb/*.deb artifacts/GiZaCode-linux-amd64.deb
          tar -czf artifacts/GiZaCode-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: giza-code-linux
          path: artifacts/*

  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            sleep 15
          done

      - name: Build GiZa Code (darwin-arm64)
        run: npm run gulp vscode-darwin-arm64-min

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cd ../VSCode-darwin-arm64
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/artifacts/GiZaCode-darwin-arm64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: giza-code-macos
          path: artifacts/*

  release:
    name: Publish release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "giza-code-build-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --title "GiZa Code build #${{ github.run_number }}" \
            --notes "Unsigned GiZa Code build from commit ${{ github.sha }}.

          - Windows: SmartScreen will warn on first run -- click \"More info\" then \"Run anyway\".
          - Mac: Gatekeeper will block it on first run -- right-click the app and choose \"Open\" once, or run \`xattr -cr /Applications/GiZa\\ Code.app\` in Terminal.
          - Linux: install the .deb with \`sudo apt install ./GiZaCode-linux-amd64.deb\`, or unpack the tar.gz anywhere." \
            artifacts/*
